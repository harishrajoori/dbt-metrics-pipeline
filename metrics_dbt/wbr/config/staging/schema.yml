  # model definition and config params for supply data mart
  - name: supply_mart
    description: "supply table"
    config:
        materialized: incremental
        incremental_strategy: merge
        unique_key: [ 'date_scope', 'financial_year', 'week_number', 'year_month_day', 'week_commencing_date',
                      'product_pl', 'region', 'category', 'sub_category', 'metric_name' ]
        views_enabled: false
        merge_update_columns: [ 'metric_value', 'last_modified' ]
        on_schema_change: append_new_column
        properties: {
          "partitioning": "ARRAY['week_commencing_date']",
          "type": "'ICEBERG'",
          "format": "'PARQUET'"
        }
        tags: [ "datamarts" ]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - 'date_scope'
            - 'financial_year'
            - 'week_number'
            - 'year_month_day'
            - 'week_commencing_date'
            - 'product_pl'
            - 'region'
            - 'category'
            - 'sub_category'
            - 'metric_name'
      # below dq checks are meant to validate data completeness using a volumetric percentage
      - validate_category_data_completeness
      - validate_sub_category_data_completeness
    columns:
      - name: metric_name
        tests:
          - not_null
      - name: week_commencing_date
        tests:
          - not_null
      - name: product_pl
        tests:
          - not_null:
              config:
                # focus on only the records that are loaded as part of the current run
                where: "date(last_modified) = current_date"
          - dbt_expectations.expect_column_distinct_count_to_equal:
              value: 3
          - accepted_values:
              # consider all values in the column including the ones from the current run
              values: ['EU', 'UK', 'UK & EU']
      - name: region
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: sub_category
        tests:
          - not_null
      - name: metric_value
        tests:
          - not_null

