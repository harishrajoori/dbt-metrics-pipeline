version: 2

models:

  # model definition and config params for acquisition data mart
  - name: acquisition_mart
    description: "acquisition data mart"
    config:
        materialized: incremental
        incremental_strategy: merge
        unique_key: [ 'date_scope', 'financial_year', 'week_number', 'year_month_day', 'week_commencing_date',
                      'product_pl', 'region', 'category', 'sub_category', 'metric_name' ]
        views_enabled: false
        merge_update_columns: [ 'metric_value', 'last_modified' ]
        on_schema_change: append_new_column
        properties: {
          "partitioning": "ARRAY['week_commencing_date']",
          "type": "'ICEBERG'",
          "format": "'PARQUET'"
        }
        tags: [ "datamarts" ]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - 'date_scope'
            - 'financial_year'
            - 'week_number'
            - 'year_month_day'
            - 'week_commencing_date'
            - 'product_pl'
            - 'region'
            - 'category'
            - 'sub_category'
            - 'metric_name'
      - validate_foreign_travel_acquisition:
          config:
            severity: warn
# ---------- DAY-only tests ----------
      - reconcile_acq_mart_mm_day:
          config:
            enabled: "{{ env_var('exe_type') == 'day' }}"
            tags: ['validate_day']

      - reconcile_incremental_gross_sales_day:
          config:
            enabled: "{{ env_var('exe_type') == 'day' }}"
            tags: ['validate_day']

      - reconcile_marketing_spend_day:
          config:
            enabled: "{{ env_var('exe_type') == 'day' }}"
            tags: ['validate_day']

      # ---------- WEEK-only tests ----------
      - reconcile_acq_mart_mm_week:
          config:
            enabled: "{{ env_var('exe_type') == 'week' }}"
            tags: ['validate_week']

      - reconcile_incremental_gross_sales_week:
          config:
            enabled: "{{ env_var('exe_type') == 'week' }}"
            tags: ['validate_week']

      - reconcile_marketing_spend_week:
          config:
            enabled: "{{ env_var('exe_type') == 'week' }}"
            tags: ['validate_week']

      # ---------- SUMMARY / FYTD-only tests ----------
      - reconcile_acq_mart_mm_summary:
          config:
            enabled: "{{ env_var('exe_type') == 'fytd' }}"
            tags: ['validate_fytd']

      - reconcile_incremental_gross_sales_summary:
          config:
            enabled: "{{ env_var('exe_type') == 'fytd' }}"
            tags: ['validate_fytd']

      - reconcile_marketing_spend_summary:
          config:
            enabled: "{{ env_var('exe_type') == 'fytd' }}"
            tags: ['validate_fytd']

    columns:
      - name: metric_name
        tests:
          - not_null
      - name: week_commencing_date
        tests:
          - not_null
      - name: product_pl
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: sub_category
        tests:
          - not_null


